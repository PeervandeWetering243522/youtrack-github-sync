name: PR title

# Squash merges use the PR title as the commit on main, and semantic-release reads those
# commits to pick the next version, so the title must be a conventional commit (CONTRIBUTING.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "The PR title is a conventional commit."
          else
            echo "::error title=PR title::Use '<type>(<scope>)?: <summary>', e.g. 'feat: reopen own closes'; see CONTRIBUTING.md."
            exit 1
          fi
