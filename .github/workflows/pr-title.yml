name: PR title

# The squash commit on main is the PR title only (V5), and semantic-release reads those commits
# to pick the next version, so the title must be a conventional commit (CONTRIBUTING.md). A
# breaking PR (`!`) needs a "## Upgrading" section, which becomes its release note. The job
# summary previews the release the PR will make. Runs again when the title or description is
# edited. The job name is the check the main ruleset requires.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Check the title and the Upgrading section, preview the release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release/check-pr.ts
